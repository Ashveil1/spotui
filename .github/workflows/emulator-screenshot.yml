name: Emulator screenshot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: gradle :app:assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            sleep 45
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.aistudio.spotui.kxmzpq/com.example.MainActivity
            sleep 35
            for i in 1 2 3; do
              if adb shell dumpsys window windows | grep -qi 'not responding'; then
                adb shell input keyevent KEYCODE_BACK
                sleep 3
              fi
              adb exec-out screencap -p > shot$i.png
              adb shell input tap 360 800
              sleep 6
            done
            adb shell dumpsys activity activities | grep -iE 'ResumedActivity' > foreground.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: |
            shot1.png
            shot2.png
            shot3.png
            foreground.txt
          if-no-files-found: error
