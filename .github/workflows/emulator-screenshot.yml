name: Emulator screenshot

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: gradle :app:assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.aistudio.spotui.kxmzpq/com.example.MainActivity
            sleep 25
            adb shell dumpsys activity activities | grep -iE 'ResumedActivity' > foreground.txt || true
            adb exec-out screencap -p > shot1.png
            adb shell input tap 360 800
            sleep 10
            adb exec-out screencap -p > shot2.png
            adb shell dumpsys activity activities | grep -iE 'ResumedActivity' >> foreground.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: |
            shot1.png
            shot2.png
            foreground.txt
          if-no-files-found: error
